<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vault — Sign in</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7C56B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF7FB;
    --panel:#FFFFFF;
    --pink-mid:#F0A0C9;
    --pink-hot:#E8447D;
    --lav-pale:#ECDEF9;
    --lav-mid:#C2A0EA;
    --lav-deep:#7C56B8;
    --lav-hot:#6A3FD1;
    --ink:#3A2E48;
    --ink-soft:#8D7F9C;
    --line:#F1DEEC;
    --bad:#C24473;
    --bad-bg:#FCE0EC;
    --shadow-lift: 0 20px 46px -18px rgba(124, 86, 184, 0.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:
      radial-gradient(ellipse 900px 500px at 8% 0%, rgba(240,160,201,0.28), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 20%, rgba(194,160,234,0.30), transparent 60%),
      radial-gradient(ellipse 700px 500px at 20% 100%, rgba(240,195,107,0.14), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
  }

  .card{
    width:100%; max-width:380px;
    background:rgba(255,255,255,.86); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:24px;
    padding:32px 28px 28px;
    box-shadow:var(--shadow-lift);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg, var(--lav-mid), var(--pink-mid));
  }

  .badge{
    display:inline-flex; align-items:center; gap:8px;
    color:var(--lav-hot); font-size:13px; font-weight:600;
    margin-bottom:18px;
    padding:6px 14px 6px 10px;
    background:linear-gradient(120deg, rgba(240,160,201,.24), rgba(194,160,234,.30));
    border:1px solid var(--lav-mid);
    border-radius:999px;
  }

  h1{
    font-family:'Newsreader', serif; font-weight:500;
    font-size:26px; line-height:1.15; margin:0 0 6px;
  }
  .sub{
    font-size:13.5px; color:var(--ink-soft); margin:0 0 22px; line-height:1.5;
  }

  form{ display:flex; flex-direction:column; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .field input{
    font-family:'Space Grotesk', sans-serif; font-size:15px; padding:12px 13px;
    border-radius:12px; border:1px solid var(--line); background:#FFFCFE; color:var(--ink);
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{
    border-color:var(--lav-deep); box-shadow:0 0 0 3px rgba(124,86,184,0.15);
  }

  .form-error{
    font-size:12.5px; color:var(--bad); background:var(--bad-bg);
    padding:9px 12px; border-radius:10px; display:none;
  }
  .form-error.show{ display:block; }

  .btn-primary{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; border-radius:13px;
    padding:13px 20px; border:none; cursor:pointer;
    background:linear-gradient(120deg, var(--lav-hot), var(--pink-hot)); color:#fff;
    transition:filter .15s ease, transform .1s ease;
    margin-top:4px;
  }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:.65; cursor:default; }
  @media (hover:hover) and (pointer:fine){
    .btn-primary:hover:not(:disabled){ filter:brightness(1.06); }
  }

  .foot{
    margin-top:18px; text-align:center; font-size:12px; color:var(--ink-soft);
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M3 12h18M3 12l3-6h12l3 6M3 12v6a1 1 0 001 1h1a1 1 0 001-1v-1h12v1a1 1 0 001 1h1a1 1 0 001-1v-6" stroke="#7C56B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7.5" cy="15.5" r="1.3" fill="#7C56B8"/>
      <circle cx="16.5" cy="15.5" r="1.3" fill="#7C56B8"/>
    </svg>
    <span>Vault</span>
  </div>
  <h1>Sign in</h1>
  <p class="sub">Enter your credentials to view and manage vehicle documents.</p>

  <form id="loginForm" method="POST" action="/api/login">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>

    <p class="form-error" id="formError"></p>

    <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
  </form>

  <p class="foot">This link is shared — anyone signed in can see and edit the data.</p>
</div>

<script>
  const form = document.getElementById('loginForm');
  const formError = document.getElementById('formError');
  const loginBtn = document.getElementById('loginBtn');

  // If already logged in, skip straight to the app.
  // (Harmless if not — the API just returns 401 and we stay here.)

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        // Redirect to wherever they were headed, defaulting to the app root.
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/';
        window.location.href = next;
        return;
      }

      const data = await res.json().catch(() => ({}));
      formError.textContent = data.error || 'Sign in failed. Please try again.';
      formError.classList.add('show');
    } catch (err) {
      formError.textContent = 'Network error — please try again.';
      formError.classList.add('show');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign in';
    }
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker registered:', reg.scope))
      .catch(err => console.error('Service Worker registration failed:', err));
  }
</script>

</body>
</html>
